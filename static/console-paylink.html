<!doctype html><html><head><meta charset="utf-8"><title>Send a pay link</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:-apple-system,sans-serif;max-width:820px;margin:24px auto;padding:0 16px;color:#222}
input,button{padding:7px 10px;margin:2px;font-size:15px}
.card{border:1px solid #ccc;border-radius:6px;padding:12px 14px;margin:10px 0}
.who{font-weight:600}.meta{color:#666;font-size:13px;margin:4px 0}.err{color:#b00}
.state{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid #999;margin-left:6px}
.state.not_sent{border-color:#b07a00;color:#b07a00}.state.sent{border-color:#2a6ebb;color:#2a6ebb}
.state.claimed{border-color:#22623c;color:#22623c}
.ship{white-space:pre-line;font-size:14px;margin:6px 0}
.preview{white-space:pre-wrap;background:#f7f7f7;border:1px solid #ddd;padding:10px;font-size:14px;margin:8px 0;display:none}
</style></head>
<body>
<script src="/static/op-nav.js" data-active="finance" data-sub="paylink"></script>
<h1>Send a pay link</h1>
<p><input id="q" placeholder="Client name" size="30" autofocus> <button id="go">Find</button></p>
<p class="meta">Shows the client's unpaid orders, and their household's. Open email writes the
message in your own mail, and you send it yourself. Click Mark sent once it has gone.</p>
<div id="out"></div>
<script>
const KEY = (function(){
  const k = new URLSearchParams(location.search).get("key");
  if (k) { try { localStorage.setItem("console_key", k); } catch(e){} }
  try { return localStorage.getItem("console_key") || k || ""; } catch(e){ return k || ""; }
})();
const H = {"X-Console-Key": KEY, "Content-Type": "application/json"};
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = c => "$" + (Number(c||0)/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const out = document.getElementById("out");
const STATE = {not_sent:"Not sent yet", sent:"Sent, waiting", claimed:"Client says paid, to confirm"};
const SHIP = {none:"Nothing to ship", pickup:"Pickup", missing:"No address on file: the email asks for one"};
let ROWS = {};

function fail(r){
  out.innerHTML = `<p class="err">${r.status === 401
    ? "Unauthorized. Unlock the main console (/console) and reload this page."
    : "Something went wrong (HTTP " + r.status + ")."}</p>`;
}
function card(r){
  const st = STATE[r.state] + (r.state === "sent" && r.sent_on ? " " + r.sent_on : "");
  const ship = r.ship.kind === "ship" ? "Ships to:\n" + r.ship.lines.join("\n")
             : r.ship.kind === "pickup" ? "Pickup at " + r.ship.lines[0] : SHIP[r.ship.kind];
  return `<div class="card" data-k="${r.id}">
    <div class="who">${esc(r.name)}${r.household ? " (household)" : ""}
      <span class="state ${esc(r.state)}">${esc(st)}</span></div>
    <div class="meta">${esc(r.date)} · ${money(r.owed_cents)} owed${r.owed_cents !== r.total_cents ? " of " + money(r.total_cents) : ""} · ${esc(r.email || "no email on file")}</div>
    <div class="ship">${esc(ship)}</div>
    <button data-act="open">Open email</button>
    <button data-act="copy">Copy email text</button>
    <button data-act="sent">Mark sent</button>
    <div class="preview"></div>
  </div>`;
}
async function find(){
  const q = document.getElementById("q").value.trim();
  if (q.length < 2) { out.innerHTML = "<p>Type at least two letters of the name.</p>"; return; }
  out.innerHTML = "<p>Looking…</p>";
  const r = await fetch("/api/console/paylink/search?q=" + encodeURIComponent(q), {headers: H});
  if (!r.ok) return fail(r);
  const j = await r.json();
  ROWS = {};
  (j.rows || []).forEach(x => { ROWS[x.id] = x; });
  out.innerHTML = j.rows && j.rows.length ? j.rows.map(card).join("")
    : "<p>No unpaid orders for that name.</p>";
}
async function draft(k){
  const r = await fetch("/api/console/paylink/" + k + "/draft", {method: "POST", headers: H});
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.ok) { alertIn(k, j.error || ("HTTP " + r.status)); return null; }
  return j;
}
function alertIn(k, msg){
  const p = document.querySelector(`.card[data-k="${k}"] .preview`);
  p.style.display = "block"; p.textContent = msg;
}
out.addEventListener("click", async e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const k = b.closest(".card").dataset.k, act = b.dataset.act;
  const prev = b.closest(".card").querySelector(".preview");
  if (act === "open" || act === "copy") {
    const d = await draft(k); if (!d) return;
    prev.style.display = "block";
    prev.textContent = "To: " + (d.to || "") + "\nSubject: " + d.subject + "\n\n" + d.body;
    if (act === "open") {
      location.href = "mailto:" + encodeURIComponent(d.to || "") + "?subject=" +
        encodeURIComponent(d.subject) + "&body=" + encodeURIComponent(d.body);
    } else {
      try { await navigator.clipboard.writeText(d.body); b.textContent = "Copied"; }
      catch (err) { b.textContent = "Select the text below to copy"; }
    }
  } else if (act === "sent") {
    const r = await fetch("/api/console/paylink/" + k + "/sent", {method: "POST", headers: H});
    if (!r.ok) return alertIn(k, "Could not mark it sent (HTTP " + r.status + ").");
    find();
  }
});
document.getElementById("go").onclick = find;
document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") find(); });
</script>
</body></html>
