<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client — Console</title>
<style>
  body{font:15px/1.5 system-ui,-apple-system,sans-serif;margin:0;color:#1a2b26;background:#f6f8f7}
  .wrap{max-width:860px;margin:0 auto;padding:20px}
  h1{margin:.2em 0}
  .sub{color:#5a6b66;font-size:13px}
  details{background:#fff;border:1px solid #e0e6e3;border-radius:10px;margin:10px 0;padding:0 14px}
  summary{cursor:pointer;padding:12px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between}
  summary::-webkit-details-marker{display:none}
  .head-note{color:#5a6b66;font-weight:400}
  .sec-body{padding:0 0 12px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{padding:6px 8px;border-bottom:1px solid #eef2f0;text-align:left}
  .strip{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .stage{flex:1;min-width:120px;border:1px solid #e0e6e3;border-radius:10px;padding:10px;background:#fff;text-align:center}
  .stage.done{background:#eaf5ef;border-color:#2f6f5e}
  .stage .dot{font-size:18px}
  .stage a,.stage button{display:inline-block;margin-top:6px;font-size:12px}
  .pill{background:#eef2f0;border-radius:20px;padding:2px 8px;font-size:12px}
  .empty{color:#8a9a95}
  #picker input{padding:8px;width:260px}
  .commerce{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
  .commerce-card{background:#fff;border:1px solid #dce4e0;border-radius:12px;padding:13px;min-width:0}
  .commerce-label{font-size:12px;color:#667770;text-transform:uppercase;letter-spacing:.05em}
  .commerce-value{font-size:17px;font-weight:650;margin:3px 0 9px}
  .commerce-card input,.commerce-card select{box-sizing:border-box;width:100%;padding:7px;border:1px solid #bdcbc5;border-radius:7px;background:#fff;margin-bottom:6px}
  .commerce-card button{padding:6px 9px}
  .commerce-actions{display:flex;gap:6px;flex-wrap:wrap}
  .commerce-note{min-height:18px;margin-top:5px;color:#667770;font-size:12px}
  .danger{color:#8b2d2d}
  .health{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 14px}
  .health-item{background:#fff;border:1px solid #dce4e0;border-radius:999px;padding:7px 11px;font-size:13px}
  .health-item.good{border-color:#a8cdbd;background:#f0f8f4}
  .health-item.attn{border-color:#e1b5a9;background:#fff5f2}
  @media(max-width:700px){.commerce{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <script src="/static/op-nav.js" data-active="people" data-sub="client"></script>
  <script src="/static/js/console-documents.js"></script>
  <div id="gate"></div>
  <div id="picker" style="display:none">
    <h1>Open a client</h1>
    <input id="q" placeholder="name or email…" autocomplete="off">
    <ul id="results"></ul>
  </div>
  <div id="hub" style="display:none">
    <h1 id="c-name">—</h1>
    <p class="sub" id="c-meta"></p>
    <p><button id="open-portal" style="display:none">Open portal</button></p>
    <div class="health" id="account-health" aria-label="Account health"></div>

    <section class="commerce" aria-label="Client commerce status">
      <div class="commerce-card">
        <div class="commerce-label">Product pricing</div>
        <div class="commerce-value" id="pricing-status">Loading…</div>
        <label class="sub" for="ff-price">All Functional Formulations</label>
        <input id="ff-price" inputmode="decimal" placeholder="Standard pricing">
        <div class="commerce-actions"><button id="save-pricing">Save</button><button id="clear-pricing">Use standard</button></div>
        <div class="commerce-note" id="pricing-note"></div>
      </div>
      <div class="commerce-card">
        <div class="commerce-label">Shipping</div>
        <div class="commerce-value" id="shipping-status">Loading…</div>
        <label class="sub" for="shipping-default">Default for new orders</label>
        <select id="shipping-default"><option value="ship">Ship to client</option><option value="pickup">Pickup — no shipping</option></select>
        <div class="commerce-actions"><button id="save-shipping">Save</button></div>
        <div class="commerce-note" id="shipping-note"></div>
      </div>
      <div class="commerce-card">
        <div class="commerce-label">Membership</div>
        <div class="commerce-value" id="membership-status">Loading…</div>
        <label class="sub" for="membership-tier">Manual membership grant</label>
        <select id="membership-tier"></select>
        <div class="commerce-actions"><button id="grant-membership">Grant</button><button class="danger" id="revoke-membership">Revoke</button></div>
        <div class="commerce-note" id="membership-note"></div>
      </div>
    </section>

    <div class="strip" id="strip"></div>

    <details id="sec-clinical"><summary>Clinical <span class="head-note" id="h-clinical"></span></summary>
      <div class="sec-body" id="b-clinical"></div></details>
    <details id="sec-tests"><summary>Tests <span class="head-note" id="h-tests"></span></summary>
      <div class="sec-body" id="b-tests"></div></details>
    <details id="sec-reports"><summary>Biofield reports <span class="head-note" id="h-reports"></span></summary>
      <div class="sec-body" id="b-reports"></div></details>
    <details id="sec-invoices"><summary>Invoices <span class="head-note" id="h-invoices"></span></summary>
      <div class="sec-body" id="b-invoices"></div></details>
    <details id="sec-comms"><summary>Comms <span class="head-note" id="h-comms"></span></summary>
      <div class="sec-body" id="b-comms"></div></details>
    <details id="sec-recs"><summary>Recommendations <span class="head-note" id="h-recs"></span></summary>
      <div class="sec-body" id="b-recs"></div></details>
    <details id="sec-docs"><summary>Documents <span class="head-note" id="h-docs"></span></summary>
      <div class="sec-body" id="b-docs"></div></details>
  </div>
</div>
<script>
function key(){ return localStorage.getItem("console_key") || ""; }
(function(){ var k=new URLSearchParams(location.search).get("key"); if(k) localStorage.setItem("console_key",k); })();
function hdr(){ return {"X-Console-Key": key()}; }
function qsEmail(){ var p=new URLSearchParams(location.search); return (p.get("email")||p.get("pq")||"").trim(); }
function money(c){ return "$"+((c||0)/100).toFixed(2); }
function esc(s){ var d=document.createElement("div"); d.textContent=(s==null?"":s); return d.innerHTML; }
function escAttr(s){ return String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

var SRC_ACTION_LABEL={biofield:"Open composer",scan:"Open FF draft",intake:"Open CRM",chat:"Open CRM"};
var SRC_ICON = {biofield:"📡", intake:"📝", scan:"🔬", chat:"💬", self:"🛒",
                email:"✉️", newsletter:"📰", ads:"📣", social:"📱", purchased:"✅"};

function renderStrip(p){
  var el=document.getElementById("strip"); el.innerHTML="";
  var email=qsEmail();
  p.stages.forEach(function(s){
    var d=document.createElement("div"); d.className="stage"+(s.done?" done":"");
    var btn="";
    if(s.action && s.action.kind==="link"){
      var href=s.action.target+"?key="+encodeURIComponent(key());
      if(s.key==="recommendation" && p.source) href+="&email="+encodeURIComponent(email);
      btn="<a href='"+href+"'>"+(SRC_ACTION_LABEL[s.source]||"Open")+"</a>";
    } else if(s.action && s.action.kind==="dispatch"){
      btn="<a href='/console/orders?key="+encodeURIComponent(key())+"'>Go</a>";
    }
    var label;
    if(s.key==="recommendation" && s.sources && s.sources.length){
      label = s.sources.map(function(src){return (SRC_ICON[src]||"")+" "+esc(src);}).join(" ");
    } else {
      label = esc(s.label);
    }
    d.innerHTML="<div class=dot>"+(s.done?"✓":"○")+"</div><div>"+label+"</div>"+btn;
    el.appendChild(d);
  });
}

function renderClinical(c){
  document.getElementById("h-clinical").textContent =
    c.active.length+" active · "+c.suggested.length+" suggested";
  var rows=c.active.concat(c.suggested);
  document.getElementById("b-clinical").innerHTML = rows.length
    ? "<table>"+rows.map(function(t){return "<tr><td><code>"+esc(t.tag)+"</code></td><td>"+esc(t.axis)+"</td></tr>";}).join("")+"</table>"
    : "<p class=empty>No tags yet.</p>";
}
function renderTests(ts){
  document.getElementById("h-tests").textContent = ts.length
    ? ts.length+" tests · latest "+ts[0].date : "no tests";
  document.getElementById("b-tests").innerHTML = ts.length
    ? "<table>"+ts.map(function(t){return "<tr><td>"+esc(t.date)+"</td><td><span class=pill>"+esc(t.type)+"</span></td></tr>";}).join("")+"</table>"
    : "<p class=empty>No tests.</p>";
}
function renderReports(reports){
  reports=reports||[];
  document.getElementById("h-reports").textContent=reports.length?reports.length+" reports":"no reports";
  document.getElementById("b-reports").innerHTML=reports.length
    ? "<table><tr><th>Date</th><th>Status</th><th>Source</th><th></th></tr>"+
      reports.map(function(r){
        var links="<a href='"+escAttr(r.composer_url||"#")+"'>open</a>";
        if(r.pdf_url) links+=" &middot; <a href='"+escAttr(r.pdf_url)+"' target='_blank' rel='noopener'>PDF</a>";
        return "<tr><td>"+esc(r.date)+"</td><td>"+esc(r.status)+"</td><td>"+esc(r.source)+"</td><td>"+links+"</td></tr>";
      }).join("")+"</table>"
    : "<p class=empty>No biofield reports.</p>";
}
function renderInvoices(inv){
  document.getElementById("h-invoices").textContent =
    money(inv.total_paid_cents)+" paid · "+money(inv.open_balance_cents)+" open";
  var rows=inv.orders.map(function(o){
    var pdf=(o.id!=null)?" &middot; <a href='#' onclick='return openInvoicePdf("+o.id+")'>PDF</a>":"";
    return "<tr><td>"+esc((o.date||"").slice(0,10))+"</td><td>"+esc(o.status)+"</td><td>"+money(o.total_cents)+
      "</td><td>"+money(o.paid_cents)+"</td><td>"+money(o.balance_cents)+
      "</td><td><a href='"+esc(o.edit_url)+"&key="+encodeURIComponent(key())+"'>edit</a>"+pdf+"</td></tr>";});
  var fmp=(inv.legacy_orders||[]).map(function(o){
    var itemCount=(o.items||[]).length;
    return "<tr><td>"+esc((o.date||"").slice(0,10))+"</td><td>"+esc(o.status||"FMP")+"</td><td>"+
      money(o.total_cents)+"</td><td>"+money(o.paid_cents)+"</td><td>"+
      money(o.balance_cents)+"</td><td>"+(itemCount?esc(itemCount+" items"):"")+"</td></tr>";});
  document.getElementById("b-invoices").innerHTML =
    (rows.length||fmp.length)
    ? "<table><tr><th>Date</th><th>Status</th><th>Total</th><th>Paid</th><th>Balance</th><th></th></tr>"+rows.join("")+fmp.join("")+"</table>"
    : "<p class=empty>No invoices.</p>";
}
// Mint a fresh invoice token for this order and open the print-ready invoice
// (?print=1 auto-opens the Save-as-PDF dialog). Reuses the Orders board endpoint.
// Open the tab synchronously first so the async fetch doesn't trip the popup blocker.
function openInvoicePdf(id){
  var w=window.open("","_blank");
  fetch("/api/console/order/"+id+"/invoice-link",{headers:hdr()})
    .then(function(r){return r.json();})
    .then(function(j){
      if(j&&j.ok&&j.link){ if(w){w.location=j.link;} else {location.href=j.link;} }
      else { if(w){w.close();} alert("Could not generate invoice PDF: "+((j&&j.error)||"unknown error")); }
    })
    .catch(function(){ if(w){w.close();} alert("Could not generate invoice PDF."); });
  return false;
}
function renderComms(cs){
  document.getElementById("h-comms").textContent = cs.length
    ? "last contact "+((cs[0].date||"").slice(0,10)||"—") : "no comms";
  document.getElementById("b-comms").innerHTML = cs.length
    ? "<table>"+cs.map(function(c){return "<tr><td>"+esc((c.date||"").slice(0,10))+"</td><td>"+esc(c.topic)+"</td><td><span class=pill>"+esc(c.source)+"</span></td></tr>";}).join("")+"</table>"
    : "<p class=empty>No comms.</p>";
}

function renderRecommendations(recs){
  var host = document.getElementById("b-recs");
  if(!recs || !recs.length){ document.getElementById("h-recs").textContent="none";
    host.innerHTML="<p class=empty>No recommendations yet.</p>"; return; }
  // rank products by top source count, then recency
  recs.forEach(function(p){
    p._max = Math.max.apply(null, p.sources.map(function(s){return s.count;}));
    p._recent = p.sources.map(function(s){return s.last_touch;}).sort().slice(-1)[0]||"";
  });
  recs.sort(function(a,b){ return b._max-a._max || (a._recent<b._recent?1:-1); });
  document.getElementById("h-recs").textContent = recs.length+" products";
  host.innerHTML = "<table>"+recs.slice(0,5).map(function(p){
    var icons = p.sources.map(function(s){
      return "<span title='"+escAttr(s.source)+" ×"+s.count+" (first "+escAttr(s.first_touch)+")'>"+
             (SRC_ICON[s.source]||"•")+esc(String(s.count))+"</span>";}).join(" ");
    var noteUi = "<input class='op-note' data-pk='"+escAttr(p.product_key)+"' value='"+escAttr(p.operator_note||"")+"' "+
      "placeholder='operator note' style='width:140px'> "+
      "<button class='op-note-save' data-pk='"+escAttr(p.product_key)+"'>save</button> "+
      "<span class='pill' title='client note'>"+esc(p.client_note||"")+"</span>";
    return "<tr><td>"+esc(p.product_key)+"</td><td>"+icons+"</td><td>"+noteUi+"</td></tr>";}).join("")+"</table>"
    + (recs.length>5 ? "<p class=empty>+"+(recs.length-5)+" more</p>" : "");
  if(!host.dataset.wired){
    host.dataset.wired="1";
    host.addEventListener("click",function(ev){
      if(!ev.target.classList.contains("op-note-save")) return;
      var pk=ev.target.getAttribute("data-pk");
      var input=host.querySelector("input.op-note[data-pk='"+pk.replace(/'/g,"\\'")+"']");
      var note=input?input.value:"";
      var btn=ev.target;
      fetch("/api/console/client/recommendation/operator-note",{
        method:"POST",
        headers:Object.assign({"Content-Type":"application/json"},hdr()),
        body:JSON.stringify({email:qsEmail(),product_key:pk,note:note})
      }).then(function(r){return r.json();}).then(function(d){
        btn.textContent = d.ok ? "saved" : "error";
        setTimeout(function(){ btn.textContent="save"; },1200);
      }).catch(function(){ btn.textContent="error"; setTimeout(function(){ btn.textContent="save"; },1200); });
    });
  }
}

function loadDocuments(){
  var email=qsEmail(); if(!email) return;
  fetch("/api/console/client-documents?email="+encodeURIComponent(email),{headers:hdr()})
    .then(function(r){ return r.ok?r.json():{items:[]}; })
    .then(function(d){
      var items=d.items||[];
      document.getElementById("h-docs").textContent=items.length?String(items.length):"";
      document.getElementById("b-docs").innerHTML=renderDocUploadHtml()+renderDocumentsHtml(items,key());
      wireDocUpload();
      wireDocumentActions();
    }).catch(function(){});
}

function wireDocUpload(){
  var btn=document.getElementById("cd-upload-btn");
  var input=document.getElementById("cd-upload-file");
  var status=document.getElementById("cd-upload-status");
  if(!btn||!input) return;
  btn.addEventListener("click",function(){
    var f=input.files&&input.files[0];
    var email=qsEmail();
    if(!f||!email){ if(status) status.textContent="Choose a file first."; return; }
    btn.disabled=true;
    if(status) status.textContent="Uploading…";
    var fd=new FormData();
    fd.append("email",email);
    fd.append("file",f);
    fetch("/api/console/client-document",{method:"POST",headers:hdr(),body:fd})
      .then(function(r){
        return r.json().catch(function(){ return {}; })
          .then(function(j){ return {ok:r.ok, body:j}; });
      })
      .then(function(res){
        if(res.ok && res.body && res.body.ok){ loadDocuments(); return; }
        if(status) status.textContent=(res.body&&res.body.error)||"Upload failed. Please try again.";
        btn.disabled=false;
      })
      .catch(function(){
        if(status) status.textContent="Upload failed. Please try again.";
        btn.disabled=false;
      });
  });
}

function checkedIdx(section,kind){
  return Array.prototype.slice.call(
    section.querySelectorAll('input[data-kind="'+kind+'"]:checked')
  ).map(function(el){ return parseInt(el.getAttribute("data-idx"),10); });
}

function wireDocumentActions(){
  var host=document.getElementById("b-docs");
  host.querySelectorAll(".cd-approve").forEach(function(btn){
    btn.addEventListener("click",function(){
      var sec=btn.closest(".cd-doc"), id=btn.getAttribute("data-doc");
      btn.disabled=true;
      fetch("/api/console/client-document/"+id+"/approve",{
        method:"POST",
        headers:Object.assign({"Content-Type":"application/json"},hdr()),
        body:JSON.stringify({
          narrative_md: sec.querySelector(".cd-narrative").value,
          attributes: checkedIdx(sec,"attributes"),
          facts: checkedIdx(sec,"facts"),
          reviewed_by: "console"
        })
      }).then(function(){ loadDocuments(); })
        .catch(function(){ btn.disabled=false; });
    });
  });
  host.querySelectorAll(".cd-reject").forEach(function(btn){
    btn.addEventListener("click",function(){
      var id=btn.getAttribute("data-doc");
      btn.disabled=true;
      fetch("/api/console/client-document/"+id+"/reject",{
        method:"POST",
        headers:Object.assign({"Content-Type":"application/json"},hdr()),
        body:JSON.stringify({reviewed_by:"console"})
      }).then(function(){ loadDocuments(); })
        .catch(function(){ btn.disabled=false; });
    });
  });
  host.querySelectorAll(".cd-toggle-visibility").forEach(function(btn){
    btn.addEventListener("click",function(){
      var id=btn.getAttribute("data-doc");
      var next=btn.getAttribute("data-visible")!=="1";
      btn.disabled=true;
      fetch("/api/console/client-document/"+id+"/visibility",{
        method:"POST",
        headers:Object.assign({"Content-Type":"application/json"},hdr()),
        body:JSON.stringify({visible:next})
      }).then(function(){ loadDocuments(); })
        .catch(function(){ btn.disabled=false; });
    });
  });
}

function showGate(){
  document.getElementById("gate").innerHTML =
    "<p class=empty>Enter a console key to view.</p>"+
    "<input id='gate-key' type='password' placeholder='console key' style='padding:8px;width:220px'> "+
    "<button id='gate-unlock'>Unlock</button>"+
    "<p><a href='/console/login'>Sign in as owner by email</a></p>";
  document.getElementById("gate-unlock").addEventListener("click",function(){
    var v=document.getElementById("gate-key").value.trim();
    if(v) localStorage.setItem("console_key",v);
    location.reload();
  });
}

function openPortal(email){
  var portalTab=window.open("about:blank","_blank");
  if(!portalTab){ alert("Pop-up blocked. Allow pop-ups and try again."); return; }
  portalTab.opener=null;
  fetch("/api/console/portal-link?email="+encodeURIComponent(email),{headers:hdr()})
    .then(function(r){return r.json().then(function(j){return {r:r,j:j};});})
    .then(function(x){
      if(!x.r.ok || !x.j.ok || !x.j.found){ portalTab.close(); alert("No portal exists for this client."); return; }
      var portalUrl=new URL(x.j.link,location.href); portalUrl.searchParams.set("from","console");
      portalTab.location.replace(portalUrl.toString());
    }).catch(function(){portalTab.close(); alert("Could not open the portal.");});
}

var commerceState=null;
function commerceMessage(id,text,isError){
  var el=document.getElementById(id); el.textContent=text||""; el.style.color=isError?"#8b2d2d":"#667770";
}
function renderCommerce(d){
  commerceState=d;
  var cents=d.pricing.ff_flat_cents;
  document.getElementById("pricing-status").textContent = cents==null ? "Standard pricing" : money(cents)+" FF flat rate";
  document.getElementById("ff-price").value = cents==null ? "" : (cents/100).toFixed(2);
  commerceMessage("pricing-note",d.pricing.custom_product_count ? d.pricing.custom_product_count+" additional product-specific price"+(d.pricing.custom_product_count===1?"":"s") : "");
  var pickup=!!d.shipping.pickup_default;
  document.getElementById("shipping-status").textContent=pickup?"Pickup by default":"Ship by default";
  document.getElementById("shipping-default").value=pickup?"pickup":"ship";
  var m=d.membership;
  document.getElementById("membership-status").textContent=m.active?(m.label||"Active membership"):"Not active";
  var detail=m.active?(m.lifetime?"Lifetime":(m.expires_at?"Through "+String(m.expires_at).slice(0,10):"Active")):"No member pricing or group access";
  commerceMessage("membership-note",detail);
  document.getElementById("revoke-membership").disabled=!m.active;
  document.getElementById("membership-tier").innerHTML=(d.membership_tiers||[]).map(function(t){return "<option value='"+escAttr(t.key)+"'>"+esc(t.label)+"</option>";}).join("");
  var h=d.account_health||{};
  var health=[
    {label:h.cart_count?"Cart: "+h.cart_count+" item"+(h.cart_count===1?"":"s"):"Cart empty",attn:false},
    {label:h.open_balance_cents?"Balance due: "+money(h.open_balance_cents):"No balance due",attn:!!h.open_balance_cents},
    {label:(h.points_cents||h.ship_credit_cents)?"Credits: "+money((h.points_cents||0)+(h.ship_credit_cents||0)):"No credits",attn:false},
    {label:h.active_subscription_count?"Subscription active":"No subscription",attn:false},
    {label:h.portal_active?"Portal active":"Portal missing",attn:!h.portal_active},
    {label:h.address_ready?"Address ready":"Address needed",attn:!h.address_ready}
  ];
  document.getElementById("account-health").innerHTML=health.map(function(x){return "<span class='health-item "+(x.attn?"attn":"good")+"'>"+esc(x.label)+"</span>";}).join("");
}
function loadCommerce(){
  return fetch("/api/console/client-commerce-status?email="+encodeURIComponent(qsEmail()),{headers:hdr()})
    .then(function(r){return r.json().then(function(d){if(!r.ok) throw new Error(d.error||"Unable to load");return d;});})
    .then(renderCommerce).catch(function(e){
      ["pricing-status","shipping-status","membership-status"].forEach(function(id){document.getElementById(id).textContent="Unavailable";});
      commerceMessage("membership-note",e.message,true);
    });
}
function postCommerce(url,body,noteId){
  commerceMessage(noteId,"Saving…");
  return fetch(url,{method:"POST",headers:Object.assign({"Content-Type":"application/json"},hdr()),body:JSON.stringify(body)})
    .then(function(r){return r.json().then(function(d){if(!r.ok) throw new Error(d.error||"Could not save");return d;});})
    .then(function(){return loadCommerce();}).then(function(){commerceMessage(noteId,"Saved");})
    .catch(function(e){commerceMessage(noteId,e.message,true);});
}
document.getElementById("save-pricing").onclick=function(){
  var value=document.getElementById("ff-price").value.trim();
  if(!value || !isFinite(Number(value)) || Number(value)<0){commerceMessage("pricing-note","Enter a valid dollar amount.",true);return;}
  postCommerce("/api/console/client-prices",{email:qsEmail(),ff_flat_cents:Math.round(Number(value)*100)},"pricing-note");
};
document.getElementById("clear-pricing").onclick=function(){
  commerceMessage("pricing-note","Saving…");
  fetch("/api/console/client-prices",{method:"DELETE",headers:Object.assign({"Content-Type":"application/json"},hdr()),body:JSON.stringify({email:qsEmail(),slug:"__all_ff__"})})
    .then(function(r){if(!r.ok) throw new Error("Could not save");return loadCommerce();}).then(function(){commerceMessage("pricing-note","Using standard pricing");})
    .catch(function(e){commerceMessage("pricing-note",e.message,true);});
};
document.getElementById("save-shipping").onclick=function(){
  postCommerce("/api/console/client-prefs",{email:qsEmail(),pickup_default:document.getElementById("shipping-default").value==="pickup"},"shipping-note");
};
document.getElementById("grant-membership").onclick=function(){
  var tier=document.getElementById("membership-tier").value;
  if(!tier)return;
  postCommerce("/api/console/membership/enroll",{email:qsEmail(),tier:tier},"membership-note");
};
document.getElementById("revoke-membership").onclick=function(){
  if(!commerceState || !commerceState.membership.active || !confirm("Revoke this client's active membership access?"))return;
  postCommerce("/api/console/membership/revoke",{email:qsEmail()},"membership-note");
};

function load(email){
  fetch("/api/console/client-360?email="+encodeURIComponent(email),{headers:hdr()})
    .then(function(r){return r.json().then(function(d){return {r:r,d:d};});})
    .then(function(x){
      if(x.r.status===401){ showGate(); return; }
      if(!x.r.ok || !x.d.ok){ throw new Error("client unavailable"); }
      var d=x.d;
      document.getElementById("picker").style.display="none";
      document.getElementById("hub").style.display="block";
      document.getElementById("c-name").textContent = d.person.name || email;
      document.getElementById("c-meta").textContent =
        [email, d.person.phone, d.person.location, d.person.profession].filter(Boolean).join(" · ");
      renderStrip(d.process); renderClinical(d.clinical); renderTests(d.tests);
      renderReports(d.reports); renderInvoices(d.invoices); renderComms(d.comms); renderRecommendations(d.recommendations);
      var portalBtn=document.getElementById("open-portal");
      portalBtn.style.display="inline-block";
      portalBtn.onclick=function(){openPortal(email);};
      loadCommerce();
      loadDocuments();
    })
    .catch(function(){ document.getElementById("gate").innerHTML="<p class='empty'>This client record is temporarily unavailable.</p>"; });
}

function initPicker(){
  document.getElementById("picker").style.display="block";
  var q=document.getElementById("q"), out=document.getElementById("results");
  q.addEventListener("input",function(){
    if(q.value.trim().length<2){ out.innerHTML=""; return; }
    fetch("/api/console/client-search?q="+encodeURIComponent(q.value.trim()),{headers:hdr()})
      .then(function(r){return r.json().then(function(d){return {r:r,d:d};});})
      .then(function(x){
        if(x.r.status===401){showGate();return;}
        var people=x.d.clients||[];
        out.innerHTML=people.map(function(p){
          var portal=p.has_portal?" · portal":"";
          return "<li><a href='/console/client?email="+encodeURIComponent(p.email)+"'>"+esc(p.name||p.email)+" — "+esc(p.email)+portal+"</a></li>";}).join("");
      })
      .catch(function(){ out.innerHTML=""; });
  });
}

var email=qsEmail();
if(email) load(email); else initPicker();
</script>
</body>
</html>
