<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your cart · Dr. Glen Swartwout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Raleway:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root{ --bg:#0a150d; --surface:#111f16; --surface-2:#162318; --border:#21472d;
      --cream:#fdf4d8; --muted:#a89870; --gold:#d4a843; --green:#3d8a52;
      --maxw:760px; --radius:14px; --ease:cubic-bezier(0.22,1,0.36,1);
      --font:"Open Sans",system-ui,sans-serif; --heading:"Raleway",system-ui,sans-serif; }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{ background:var(--bg); color:var(--cream); font-family:var(--font);
      font-size:17px; line-height:1.7; -webkit-font-smoothing:antialiased;
      background-image:radial-gradient(120% 80% at 50% -10%, rgba(212,168,67,0.07), transparent 60%);
      background-attachment:fixed; }
    h1,h2,h3{ font-family:var(--heading); font-weight:600; line-height:1.25; letter-spacing:-0.01em; }
    a{ color:inherit; text-decoration:none; }
    .shell{ max-width:var(--maxw); margin:0 auto; padding:0 24px 48px; }
    .brandbar{ max-width:var(--maxw); margin:0 auto; padding:30px 24px 8px; display:flex; align-items:center; justify-content:center; gap:14px; }
    .brand-mark{ width:7px; height:7px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 4px rgba(212,168,67,0.12); }
    .brand-name{ font-family:var(--heading); font-weight:600; font-size:13px; letter-spacing:0.32em; color:var(--muted); }

    h1{ font-size:clamp(24px,5vw,30px); color:var(--cream); margin-top:34px; }
    .muted{ color:var(--muted); font-size:14.5px; margin-top:10px; line-height:1.6; }

    #cart-items{ margin-top:28px; }
    .line{ display:flex; align-items:center; flex-wrap:wrap; gap:12px 14px;
      padding:16px 0; border-bottom:1px solid var(--border); }
    .line a{ font-weight:600; font-size:15px; color:var(--cream); flex:1 1 auto; min-width:160px; }
    .badge{ font-size:12px; color:var(--muted); border:1px solid var(--border);
      border-radius:999px; padding:3px 10px; }
    .qty{ display:inline-flex; align-items:center; gap:8px; font-family:var(--heading); }
    .qty span{ min-width:18px; text-align:center; font-weight:600; }
    .qty button{ width:30px; height:30px; border-radius:50%; border:1px solid rgba(212,168,67,0.4);
      background:transparent; color:var(--gold); font-size:16px; line-height:1; cursor:pointer;
      transition:border-color .2s var(--ease), background .2s var(--ease); }
    .qty button:hover{ border-color:var(--gold); background:rgba(212,168,67,0.08); }
    .remove{ background:transparent; border:none; color:var(--muted); font-size:13px;
      cursor:pointer; text-decoration:underline; }
    .remove:hover{ color:var(--cream); }

    .cart-actions{ display:flex; align-items:center; justify-content:space-between;
      flex-wrap:wrap; gap:16px; margin-top:28px; }
    .text-link{ color:var(--gold); font-family:var(--heading); font-weight:600; font-size:14px; }
    .text-link:hover{ text-decoration:underline; }
    button.text-link{ background:transparent; border:none; padding:0; cursor:pointer; }
    .cta-btn{ display:inline-block; background:var(--gold); color:#0a150d; font-family:var(--heading);
      font-weight:700; font-size:15px; letter-spacing:0.03em; padding:14px 34px; border:none;
      border-radius:999px; cursor:pointer;
      transition:opacity .25s var(--ease), transform .25s var(--ease); }
    .cta-btn:hover:not(:disabled){ opacity:0.9; transform:translateY(-1px); }
    .cta-btn:disabled{ opacity:0.5; cursor:default; transform:none; }

    /* ── Shipping address (opens behind "Ship to a different address") ── */
    .ship-block{ margin-top:24px; }
    .ship-form{ margin-top:14px; padding:16px; background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius); }
    .ship-note{ font-size:13px; color:var(--muted); margin-bottom:14px; }
    .field{ display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
    .field label{ font-family:var(--heading); font-weight:600; font-size:12px; letter-spacing:0.03em;
      color:var(--muted); }
    .field input{ background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
      padding:10px 12px; font-size:15px; font-family:var(--font); color:var(--cream); width:100%; }
    .field-row{ display:flex; gap:10px; }
    .field-row .field{ flex:1 1 auto; min-width:0; }
    .field-state{ flex:0 0 78px; }
    .field-zip{ flex:0 0 110px; }

    button:focus-visible, a:focus-visible, input:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

    :root[data-theme="light"] .text-link{ color:#7A5C1F; }
    :root[data-theme="light"] .qty button{ color:#7A5C1F; border-color:#B08A3E; }
    :root[data-theme="light"] .qty button:hover{ border-color:#7A5C1F; background:rgba(176,138,62,0.08); }
    :root[data-theme="light"] button:focus-visible,
    :root[data-theme="light"] a:focus-visible,
    :root[data-theme="light"] input:focus-visible{ outline-color:#7A5C1F; }

    @media(max-width:560px){
      body{ font-size:16px; }
      .shell{ padding:0 18px 40px; }
      .line{ flex-direction:column; align-items:flex-start; }
      .line a{ min-width:0; }
      .cart-actions{ flex-direction:column; align-items:stretch; }
      .cart-actions .cta-btn{ width:100%; text-align:center; }
      .field-row{ flex-direction:column; }
      .field-state, .field-zip{ flex:1 1 auto; }
    }
  </style>
  <script src="/static/theme-toggle.js"></script>
  <script src="/static/theme-mode.js"></script>
</head>
<body>
  <div id="theme-toggle-wrap" style="position:fixed;top:14px;right:16px;z-index:50"><span class="theme-toggle" id="themeToggle" role="group" aria-label="Theme mode"></span></div>
  <div class="brandbar"><span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">Remedy&nbsp;Match &nbsp;&middot;&nbsp; Healing&nbsp;Oasis</span></div>
  <main class="shell">
    <h1>Your cart</h1>
    <p class="muted">Your price, shipping and any member savings are confirmed at checkout.</p>
    <div id="cart-items" aria-live="polite">Loading&hellip;</div>
    <div class="ship-block">
      <button type="button" id="ship-toggle" class="text-link" aria-expanded="false" aria-controls="ship-form">Ship to a different address</button>
      <div id="ship-form" class="ship-form" hidden>
        <p class="ship-note">US addresses only.</p>
        <div class="field">
          <label for="ship-name">Full name</label>
          <input type="text" id="ship-name" autocomplete="name">
        </div>
        <div class="field">
          <label for="ship-street">Street address</label>
          <input type="text" id="ship-street" autocomplete="address-line1">
        </div>
        <div class="field">
          <label for="ship-street2">Apartment, suite or unit (optional)</label>
          <input type="text" id="ship-street2" autocomplete="address-line2">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="ship-city">City</label>
            <input type="text" id="ship-city" autocomplete="address-level2">
          </div>
          <div class="field field-state">
            <label for="ship-state">State</label>
            <input type="text" id="ship-state" autocomplete="address-level1" maxlength="2">
          </div>
          <div class="field field-zip">
            <label for="ship-zip">ZIP code</label>
            <input type="text" id="ship-zip" autocomplete="postal-code" inputmode="numeric">
          </div>
        </div>
      </div>
    </div>
    <p id="cart-msg" class="muted" role="status"></p>
    <div class="cart-actions">
      <a class="text-link" id="keep-shopping" href="#">Keep shopping</a>
      <button id="cart-checkout" class="cta-btn" type="button" disabled>Checkout</button>
    </div>
  </main>
  <script src="/static/optin-gate.js"></script>
  <script>
  (function(){
    // A later task changes this to /shop, once /shop exists. One constant, both links.
    var BROWSE_PAGE = "/begin/match";
    var box = document.getElementById("cart-items"), msg = document.getElementById("cart-msg");
    var btn = document.getElementById("cart-checkout");
    document.getElementById("keep-shopping").href = BROWSE_PAGE;

    // ── Shipping address (fix wave: first-time buyers had no way to supply one) ──
    var shipToggle = document.getElementById("ship-toggle");
    var shipForm = document.getElementById("ship-form");
    var shipFields = {
      name: document.getElementById("ship-name"),
      street: document.getElementById("ship-street"),
      street2: document.getElementById("ship-street2"),
      city: document.getElementById("ship-city"),
      state: document.getElementById("ship-state"),
      zip: document.getElementById("ship-zip")
    };
    function openShipForm(){
      shipForm.hidden = false;
      shipToggle.setAttribute("aria-expanded", "true");
      shipToggle.textContent = "Hide the address form";
    }
    function closeShipForm(){
      shipForm.hidden = true;
      shipToggle.setAttribute("aria-expanded", "false");
      shipToggle.textContent = "Ship to a different address";
    }
    shipToggle.onclick = function(){ if (shipForm.hidden) openShipForm(); else closeShipForm(); };
    function collectShipAddress(){
      return {
        name: shipFields.name.value.trim(), street: shipFields.street.value.trim(),
        street2: shipFields.street2.value.trim(), city: shipFields.city.value.trim(),
        state: shipFields.state.value.trim(), zip: shipFields.zip.value.trim()
      };
    }
    function firstMissingShipField(a){
      if (!a.name) return shipFields.name;
      if (!a.street) return shipFields.street;
      if (!a.city) return shipFields.city;
      if (!a.state) return shipFields.state;
      if (!a.zip) return shipFields.zip;
      return null;
    }
    function isAddressError(d){ return !!(d && d.error && /shipping address/i.test(d.error)); }

    // ── Checkout was cancelled at Stripe (platform's cancel route, when it lands) ──
    var qparams = new URLSearchParams(location.search);
    var showCancelled = qparams.get("checkout") === "cancelled";
    function announceCancelledIfNeeded(d){
      if (!showCancelled) return;
      showCancelled = false;
      var items = (d && d.items) || [];
      msg.textContent = items.length
        ? "Checkout was cancelled. Your cart is still here."
        : "Checkout was cancelled.";
      var url = new URL(location.href);
      url.searchParams.delete("checkout");
      history.replaceState(null, "", url.pathname + (url.search || "") + url.hash);
    }

    function esc(s){ return String(s||"").replace(/[&<>"]/g, function(ch){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]; }); }
    function render(d){
      var items = (d && d.items) || [];
      btn.disabled = !items.some(function(i){ return i.available; });
      if (!items.length){
        box.innerHTML = '<p>Your cart is empty. <a class="text-link" id="browse-remedies" href="#">Browse remedies</a>.</p>';
        document.getElementById("browse-remedies").href = BROWSE_PAGE;
        return;
      }
      box.innerHTML = items.map(function(i){
        return '<div class="line" data-slug="' + esc(i.slug) + '" data-format="' + esc(i.format) + '">' +
          '<a href="/begin/product/' + esc(i.slug) + '">' + esc(i.name) + '</a>' +
          (i.available ? '' : ' <span class="badge">No longer available</span>') +
          '<span class="qty"><button type="button" data-d="-1" aria-label="One fewer ' + esc(i.name) + '">&minus;</button>' +
          '<span>' + i.qty + '</span><button type="button" data-d="1" aria-label="One more ' + esc(i.name) + '">+</button></span>' +
          '<button type="button" class="remove" aria-label="Remove ' + esc(i.name) + ' from cart">Remove</button></div>';
      }).join("");
      box.querySelectorAll(".line button").forEach(function(b){
        b.onclick = function(){
          var line = b.closest(".line"), cur = parseInt(line.querySelector(".qty span").textContent, 10);
          var qty = b.classList.contains("remove") ? 0 : Math.max(0, cur + parseInt(b.dataset.d, 10));
          post("/api/cart/set-qty", {slug: line.dataset.slug, format: line.dataset.format, qty: qty})
            .then(function(res){ render(res.body); })
            .catch(function(){ msg.textContent = "That change did not save. Please try again."; load(); });
        };
      });
    }
    // Resolves {status, body}: checkout needs the HTTP status (to tell a 5xx
    // apart from a 4xx) as well as the parsed JSON, so this can't just return
    // the body the way the old version did.
    function post(url, body){
      return fetch(url, {method: "POST", credentials: "same-origin",
        headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})})
        .then(function(r){ return r.json().then(function(d){ return {status: r.status, body: d}; }); });
    }
    function load(){
      fetch("/api/cart", {credentials: "same-origin"}).then(function(r){ return r.json(); })
        .then(function(d){ render(d); announceCancelledIfNeeded(d); })
        .catch(function(){ box.textContent = "Your cart could not load. Please try again."; });
    }
    function checkout(){
      var body = {};
      if (!shipForm.hidden){
        var addr = collectShipAddress();
        var missing = firstMissingShipField(addr);
        if (missing){
          msg.textContent = "Please fill in the required shipping fields.";
          missing.focus();
          return;
        }
        body.address = addr;
      }
      btn.disabled = true; msg.textContent = "Starting checkout…";
      post("/api/cart/checkout", body).then(function(res){
        var status = res.status, d = res.body;
        if (d && d.need_optin && window.OptinGate){ btn.disabled = false; msg.textContent = "";
          OptinGate.show({base: "", onAgree: function(){ checkout(); }}); return; }
        if (d && d.ok && d.stripe_url){ location.href = d.stripe_url; return; }
        if (d && d.ok){ msg.textContent = "Your order is placed. A confirmation is on its way."; load(); return; }
        if (d && d.unavailable){ msg.textContent = "Some items are no longer available. Remove them to continue."; load(); return; }
        // Anything 500 or above carries raw server error text meant for logs,
        // not for a customer. Only a 4xx error string is safe to show as is.
        if (status >= 500){
          msg.textContent = "Checkout did not start. Please try again."; btn.disabled = false; return;
        }
        if (isAddressError(d)){
          openShipForm();
          shipFields.name.focus();
          msg.textContent = (d && d.error) || "Please add a shipping address to check out.";
          btn.disabled = false; return;
        }
        msg.textContent = (d && d.error) || "Checkout did not start. Please try again."; btn.disabled = false;
      }).catch(function(){ msg.textContent = "Checkout did not start. Please try again."; btn.disabled = false; });
    }
    btn.onclick = checkout;
    load();
  })();
  </script>
  <script>if (window.RMTheme) window.RMTheme.mountToggle(document.getElementById('themeToggle'));</script>
</body>
</html>
