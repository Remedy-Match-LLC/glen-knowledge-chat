<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Set password · Healing Oasis</title>
  <style>
    :root{--bg:#0a150d;--card:#13241a;--line:#274033;--ink:#f3efe2;--muted:#9fb0a4;--brand:#d4a843}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
    main{max-width:430px;margin:14vh auto;padding:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
    h1{font-size:1.35rem;margin-top:0}.sub{color:var(--muted)}label{display:block;margin:14px 0 6px}
    input,button{width:100%;padding:13px;border-radius:10px;font:inherit}input{border:1px solid var(--line);background:var(--bg);color:var(--ink)}
    button{margin-top:14px;border:0;background:var(--brand);color:#0a150d;font-weight:700;cursor:pointer}.msg{min-height:1.5em;color:var(--brand)}
  </style>
</head>
<body><main><div class="card">
  <h1>Set your password</h1>
  <p class="sub">Use at least 12 characters. A password manager is welcome.</p>
  <label for="password">New password</label>
  <input id="password" type="password" autocomplete="new-password" minlength="12">
  <label for="confirm">Confirm password</label>
  <input id="confirm" type="password" autocomplete="new-password" minlength="12">
  <button id="save">Save password</button>
  <p class="msg" id="msg" role="status"></p>
</div></main>
<script>
const save=document.getElementById('save'),msg=document.getElementById('msg');
save.addEventListener('click',async()=>{
  const password=document.getElementById('password').value;
  if(password!==document.getElementById('confirm').value){msg.textContent='The passwords do not match.';return;}
  save.disabled=true;
  try{
    const token=new URLSearchParams(location.search).get('token')||'';
    const r=await fetch('/portal/password-reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})});
    const j=await r.json(); msg.textContent=j.message||'';
    if(r.ok&&j.redirect) location.replace(j.redirect);
  }catch(e){msg.textContent='Something went wrong — please try again.';}
  save.disabled=false;
});
</script></body></html>
