<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Appointment Proposals</title><style>
body{margin:0;background:#0a150d;color:#f3efe2;font:16px/1.5 system-ui}.wrap{max-width:850px;margin:auto;padding:28px 18px}.card{background:#13241a;border:1px solid #274033;border-radius:14px;padding:18px;margin:14px 0}input,select,textarea,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #456451;background:#16291d;color:#f3efe2}form{display:grid;gap:9px}.btn{background:#d4a843;color:#0a150d;font-weight:700;cursor:pointer}.msg{background:#1b3022;border-radius:8px;padding:8px;margin:6px 0}.muted{color:#9fb0a4}.badge{display:inline-block;background:#274033;padding:2px 9px;border-radius:99px}audio{width:100%}
</style></head><body><main class="wrap"><h1>Appointment Proposals</h1><p class="muted">Propose and confirm private client sessions. Messages and audio stay attached to the appointment.</p>
<section class="card"><h2>Propose a time</h2><p class="muted">Times entered here use Hawaiʻi time.</p><form id="new"><input name="email" type="email" placeholder="Client email" required><select name="session_type"><option value="biofield-consult">Biofield Analysis Consultation</option><option value="evox">EVOX Session</option></select><input name="proposed_start" type="datetime-local" required><select name="billing_mode"><option value="paid">Paid</option><option value="prepaid">Pre-paid / credit</option></select><input name="price_cents" type="number" min="0" placeholder="Price in cents (optional)"><button class="btn">Send proposal</button></form></section><div id="list">Loading…</div></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const r=await fetch('/api/console/appointment-proposals'),d=await r.json(),h=document.getElementById('list');if(!r.ok){h.textContent='Could not load.';return}h.innerHTML=(d.proposals||[]).map(p=>`<section class="card"><h2>${esc(p.session_label)}</h2><div>${esc(p.client_email)} · ${esc(new Date(p.start_iso||p.proposed_start).toLocaleString())} · ${esc(p.medium)} · ${esc(p.billing_mode)}</div><p><span class="badge">${esc(p.status)}</span></p>${!p.staff_confirmed?`<button class="btn confirm" data-id="${p.id}">Confirm this time</button>`:''}<div>${(p.messages||[]).map(m=>`<div class="msg"><b>${esc(m.sender==='client'?'Client':m.sender)}</b><div>${esc(m.text)}</div>${m.audio_filename?`<audio controls src="/api/console/appointment-proposals/${p.id}/audio/${m.id}"></audio>`:''}</div>`).join('')}</div><form class="reply" data-id="${p.id}"><textarea name="text" placeholder="Reply privately…"></textarea><input name="audio" type="file" accept="audio/*"><button class="btn">Send reply</button></form></section>`).join('')||'<p>No proposals yet.</p>';h.querySelectorAll('.confirm').forEach(b=>b.onclick=async()=>{const r=await fetch(`/api/console/appointment-proposals/${b.dataset.id}/confirm`,{method:'POST'});if(r.ok)load();else alert('Could not confirm; the time may be unavailable.')});h.querySelectorAll('.reply').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const r=await fetch(`/api/console/appointment-proposals/${f.dataset.id}/messages`,{method:'POST',body:new FormData(f)});if(r.ok)load();else alert('Could not send reply.')})}
document.getElementById('new').onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target).entries()),r=await fetch('/api/console/appointment-proposals',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.ok){e.target.reset();load()}else alert('Could not create proposal.')};load();
</script></body></html>
